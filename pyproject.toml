[project]
name = "mgit"
version = "0.1.0"
description = "A git wrapper with rich log search, git-flow helpers, and an optional modern TUI."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = ["pytest-asyncio>=0.24"]

[project.scripts]
mgit = "mgit.cli.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
